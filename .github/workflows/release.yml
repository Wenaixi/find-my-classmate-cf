name: Release

# 发布流水线的两半：deploy.yml 负责把 Worker 真正推上线，本文件负责写 GitHub
# Release 记录。两者都由 tag 触发、互不依赖——部署失败不该让发布记录缺失，
# 发布记录失败也不该拦住部署。合并成一个 job 会让「线上跑的是哪个版本」与
# 「仓库里记录了哪个版本」互相拖累。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: 校验并生成 GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 与 CI 同形的依赖源守卫（含文件存在性判断，理由见 ci.yml 同名步骤注释）：
      # 发布流水线上更不容许镜像源进锁文件。
      - name: 依赖源守卫（锁文件中不得出现镜像源）
        run: |
          if [ ! -f package-lock.json ]; then
            echo "错误：package-lock.json 不存在，依赖安装未完成或锁文件被删。" >&2
            exit 1
          fi
          count=$(grep -c npmmirror package-lock.json || true)
          if [ "$count" != "0" ]; then
            echo "错误：package-lock.json 含 $count 处 npmmirror，依赖来源必须是官方 registry。" >&2
            exit 1
          fi
          echo "依赖源守卫通过：锁文件不含镜像源。"

      # 打 tag 前必须已经全绿，这里再跑一遍是因为 tag 可能打在未过 CI 的提交上，
      # 而 GitHub Release 一旦写出就是对外承诺。顺序同样是 build 先于 test
      # （理由见 ci.yml：worker 集成测试需要 dist 里有真实产物）。
      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build

      - name: 单元测试
        run: npm test

      - name: 部署配置校验（dry-run）
        run: npm run deploy:dry-run

      - name: 提取更新记录（按当前 tag 精确匹配，找不到则显式失败）
        run: |
          TAG="${{ github.ref_name }}"
          # 判据必须是行首锚定的严格相等而非子串包含：index($0, tag)>0 会让
          # v0.1 命中 "## [v0.10.4]"——实测两者抽出的正文逐字节相同（md5 一致），
          # 而下面那道 grep 兜底被子串前缀同样满足，两道检查在同一个错误前提
          # （子串等于相等）上同时失效，这条本该防 tag 脱钩的门禁成了橡皮图章。
          # index 返回 1-based 位置，行首命中即 1；日期后缀不影响判定。
          # 找不到交由 awk 自身 END 退出码判定，取代原先的 grep 兜底。
          awk -v tag="$TAG" '
            BEGIN { found = 0; target = "## [" tag "]" }
            /^## / {
              if (found) exit
              if (index($0, target) == 1) found = 1
            }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-body.md || {
            echo "未找到 CHANGELOG 中与 ${TAG} 完全一致的更新记录标题（需形如 '## [${TAG}]'），请先在 CHANGELOG.md 顶部追加。" >&2
            exit 1
          }

      # 发布包不含任何二进制或容器镜像：部署形态是 `wrangler deploy`，线上版本
      # 由 Cloudflare 托管，仓库不再产出可下载产物。Release 只是版本记录，
      # 因此也不附名单数据（真实名单不进仓库，由管理 API 上传到 KV）。
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: FindMyClassmate ${{ github.ref_name }}
          body_path: release-body.md
