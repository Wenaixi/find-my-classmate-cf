name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# 顶层权限收窄到只读：CI 只读仓库内容（checkout），不上传 artifact、不写
# Release、不碰仓库写权限。迁移删掉 Go/Docker job 时这条一起被删掉了，现在
# 补回——默认的 token 权限比这宽，收窄后即使某个 step 被注入也写不了仓库。
permissions:
  contents: read

jobs:
  frontend:
    name: 前端 + Worker · 依赖守卫 / 类型检查 / 构建 / 测试 / 部署配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 依赖源守卫：本机 ~/.npmrc 的 registry 指向镜像源，`npm install` 之后
      # package-lock.json 里会出现 npmmirror 的 URL。这类改动不会让任何测试
      # 翻红，却把整条供应链悄悄换成镜像依赖（T-U1 已记录过复发）。
      #
      # 用 grep -c 直接数字比对而不是 `grep -q`：-c 给出的是「有几处」，
      # 报错信息能带上数量，排查时不必再手动数一遍。grep 无匹配时退出码为 1，
      # 因此 `|| true` 是必需的，否则守卫会在「零处」这个正确状态下失败。
      #
      # 先单独判文件是否存在：grep 对不存在的文件也返回非零，被 `|| true` 兜住后
      # 会得到空字符串，于是报错信息会变成「含  处 npmmirror」。那种措辞把
      # 「锁文件没生成」和「锁文件用了镜像源」两件事混成一个，排查方向会跑偏。
      - name: 依赖源守卫（锁文件中不得出现镜像源）
        run: |
          if [ ! -f package-lock.json ]; then
            echo "错误：package-lock.json 不存在，依赖安装未完成或锁文件被删。" >&2
            exit 1
          fi
          count=$(grep -c npmmirror package-lock.json || true)
          if [ "$count" != "0" ]; then
            echo "错误：package-lock.json 含 $count 处 npmmirror，依赖来源必须是官方 registry。" >&2
            exit 1
          fi
          echo "依赖源守卫通过：锁文件不含镜像源。"

      - name: 依赖漏洞审计
        run: npm audit --audit-level=high

      - name: 类型检查
        run: npm run typecheck

      # 生产构建必须早于单元测试：worker 集成测试跑的是真实装配链，其中的
      # firstAssetPath() 从首页 HTML 提取真实的 /assets/* 哈希路径、firstFontPath()
      # 从 CSS 提取 /fonts/*，这五条用例（非 /api 回退、/assets 长缓存、304、
      # /fonts 长缓存、单页回退）全部依赖 dist 里真有一份产物。
      #
      # dist 在 .gitignore 里，`npm ci` 不产出它，package.json 也没有 pretest
      # 钩子——干净检出上先跑 test 必红 5 条，而这 5 条红的信息看起来像
      # 「静态资源分支坏了」，实际只是构建没跑。
      #
      # 顺序因此固定为：npm ci → 守卫 → typecheck → build → test → dry-run。
      - name: 生产构建
        run: npm run build

      - name: 单元测试
        run: npm test

      # secrets 文件生成脚本的自测。它只在打 tag 的部署流水线里被真正调用，
      # CI 里跑一次是为了让转义逻辑（引号/反斜杠/$/换行）在合并前就被验证——
      # 否则一个写错的值要到发布那一刻才暴露，且表现为「管理端全 401」。
      - name: secrets 文件脚本自测
        run: node scripts/gen-secrets-file.mjs --self-test

      # 名单上传脚本的自测。同理：它只在真实部署或校内迁移名单时被调用，
      # CI 里跑一次把「按校拆分 + URL 编码 + 失败归类」的逻辑在合并前验证掉。
      - name: 名单上传脚本自测
        run: node scripts/upload-roster.mjs --self-test

      # 部署配置校验。同样必须在构建之后：实测 assets.directory 不存在时
      # `wrangler deploy --dry-run` 会直接报
      # 「The directory specified by the "assets.directory" field ... does not exist」
      # 并退出。
      - name: 部署配置校验（dry-run）
        run: npm run deploy:dry-run

  data:
    name: 数据边界守卫 · 真实名单零数据检测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 数据边界守卫（真实名单不随仓库分发）
        run: |
          # 真实名单（data/*.json）不进仓库、不进发布包；仓库中不应存在任何名单数据。
          # 名单的结构校验与加载契约由 src/shared/roster.test.ts 与
          # src/worker/rosterStore.test.ts 以合成 fixture 覆盖，在 frontend job 里已跑。
          # 真实名单形态另由上传脚本的 --self-test 与校内部署时的实测把关。
          #
          # 注意这条守卫只查**文件名**。它拦不住「真实姓名被写成源码字面量」那种泄漏
          # （曾经真的发生过：4 个在校生姓名进了 fixture）。字面量泄漏由下面那条
          # check-roster-leak 步骤覆盖，但它在 CI 里恒无 data 可比对——仓库侧的防线
          # 是 fixture 只用合成名白名单，见 upload-roster.mjs 的 --self-test。
          if ls data/*.json >/dev/null 2>&1; then
            echo "错误：data/ 目录包含名单数据文件，真实名单不得随仓库分发（隐私红线）。" >&2
            exit 1
          fi
          echo "零数据守卫通过：仓库无名单数据文件；名单加载契约由 TS 侧测试覆盖。"

      # 比较器自测：验证「真实姓名 vs 追踪文件」的比对逻辑本身能抓差异。
      # 没有这一步，「零命中」无法区分「真的干净」与「比较器失效」——这与既有变异
      # 纪律同一条道理。CI 里没有 data/，所以只跑自测，不跑真实比对。
      - name: 泄漏扫描比较器自测
        run: node scripts/check-roster-leak.mjs --self-test

      # 有 data/ 时才生效（本地与校内环境）。CI 恒无 data，此步会打印「跳过」并
      # 退出 0——那是「这次没查」，不是「查过没问题」，输出里写明了这一区别。
      - name: 真实姓名泄漏扫描（有 data/ 时生效）
        run: node scripts/check-roster-leak.mjs
